name: Bairro Vivo - Godot validation

on:
  push:
    branches: [feature/bairro-vivo-2]
  pull_request:
    branches: [main]
    paths:
      - "scripts/**"
      - "tests/**"
      - "scenes/**"
      - "project.godot"
      - ".github/workflows/bairro-vivo-godot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Godot 4.4.1
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          sudo install -m 755 /tmp/Godot_v4.4.1-stable_linux.x86_64 /usr/local/bin/godot
          godot --version
      - name: Import project and check scripts
        run: godot --headless --path . --editor --import --quit
      - name: Test NPC profiles
        run: godot --headless --path . --script res://tests/test_npc_interesse.gd
      - name: Test NPC commerce integration
        run: godot --headless --path . --script res://tests/test_bairro_fluxo_comercial.gd
      - name: Test tree wind structure
        run: godot --headless --path . --script res://tests/test_vento_copa.gd
