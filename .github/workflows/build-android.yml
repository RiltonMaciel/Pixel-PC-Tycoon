name: Pixel PC Tycoon V0.4.8 - APK Android
on:
  workflow_dispatch:
  push:
    paths:
      - "project.godot"
      - "scenes/**"
      - "scripts/**"
      - "Assets/**"
      - "tests/**"
      - ".github/workflows/build-android.yml"
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Confirmar que e a versao nova completa
        run: |
          set -euo pipefail
          test -s project.godot
          test -s scenes/RuaComercial.tscn
          test -s scripts/RuaComercial.gd
          test -s Assets/Cenarios/Rua_Comercial_Aprovada.png
          test -s Assets/Cenarios/Loja_Base_Aprovada.png
          test -s Assets/Personagens/jogador_temporario.png
          test -s Assets/Personagens/cliente_temporario.png
          test -s Assets/Moveis/balcao_pixel_art.png
          test -s Assets/Cenarios/Exterior/PC_Store_Com_Telhado.png
          test -s Assets/Cenarios/Modular/manifest_encaixes.json
          test -s Assets/Cenarios/Bairro/manifesto_conexoes.json
          test -s Assets/Cenarios/Bairro/pc_store_recorte.png
          test -s Assets/Cenarios/Bairro/calcada_concreto_a.png
          test -s Assets/Cenarios/Bairro/travessia_orientacao_a_lado_1.png
          test -s Assets/Cenarios/Bairro/cafeteria.png
          test -s Assets/Cenarios/Bairro/cafeteria.json
          test -s Assets/Cenarios/Bairro/asfalto_continuo.png
          test -s Assets/Cenarios/Bairro/calcada_continua.png
          test -s Assets/Cenarios/Vizinhanca/manifesto.csv
          test -s Assets/Cenarios/Vizinhanca/01_predios/mercadinho.png
          test -s Assets/Cenarios/Vizinhanca/02_vegetacao/arvore_copa_redonda.png
          test -s scripts/CatalogoVizinhanca.gd
          test -s scripts/VizinhancaComercial.gd
          test -s Assets/Personagens/Modulares/protagonista/protagonista_frente_idle.png
          test -s Assets/Moveis/Modulares/balcao_atendimento.png
          for angle in 0 90 180 270; do
            test -s "Assets/Moveis/Balcoes/balcao_pc_store/$angle.png"
          done
          grep -q 'RuaComercial.tscn' project.godot
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Instalar Godot 4.4.1 e templates
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/godot-bin" "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          curl -fL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d "$HOME/godot-bin"
          mv "$HOME/godot-bin/Godot_v4.4.1-stable_linux.x86_64" "$HOME/godot-bin/godot"
          chmod +x "$HOME/godot-bin/godot"
          curl -fL --retry 3 -o /tmp/templates.tpz https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz
          unzip -qoj /tmp/templates.tpz 'templates/android_debug.apk' 'templates/android_release.apk' 'templates/version.txt' -d "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          test -s "$HOME/.local/share/godot/export_templates/4.4.1.stable/version.txt"
      - name: Validar sprites e encaixes do cenario
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check Pillow
          python3 tests/test_assets.py
      - name: Importar e validar GDScript
        run: |
          set -euo pipefail
          "$HOME/godot-bin/godot" --headless --path . --editor --import --quit > /tmp/import.log 2>&1 || { cat /tmp/import.log; exit 1; }
          cat /tmp/import.log
          "$HOME/godot-bin/godot" --headless --path . --quit-after 30 > /tmp/smoke.log 2>&1 || { cat /tmp/smoke.log; exit 1; }
          cat /tmp/smoke.log
          if grep -Eqi '(SCRIPT ERROR|Parse Error|Failed to load script|Invalid call|Invalid access|Cannot open file|ERROR:)' /tmp/import.log /tmp/smoke.log; then exit 1; fi
      - name: Testar entrada, moveis e persistencia
        run: |
          set -euo pipefail
          timeout 90 "$HOME/godot-bin/godot" --headless --path . --script tests/test_game.gd > /tmp/tests.log 2>&1 || { cat /tmp/tests.log; exit 1; }
          cat /tmp/tests.log
          grep -Eq '^RESULT: [0-9]+ passed, 0 failed$' /tmp/tests.log
          if grep -Eqi '(SCRIPT ERROR|Parse Error|ERROR:)' /tmp/tests.log; then exit 1; fi
      - name: Preparar exportacao Android
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android" "$HOME/.config/godot"
          keytool -genkeypair -noprompt -keystore "$HOME/.android/debug.keystore" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Pixel PC Tycoon Dev, O=Pixel PC Tycoon, C=BR"
          cat > export_presets.cfg <<'PRESET'
          [preset.0]
          name="Android"
          platform="Android"
          runnable=true
          advanced_options=false
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter="tests/*,tools/*"
          export_path=""
          [preset.0.options]
          gradle_build/use_gradle_build=false
          package/unique_name="com.pixelpctycoon.game"
          package/name="Pixel PC Tycoon"
          package/signed=true
          keystore/debug="/home/runner/.android/debug.keystore"
          keystore/debug_user="androiddebugkey"
          keystore/debug_password="android"
          package/version_code=48
          package/version_name="0.4.8"
          permissions/internet=true
          architectures/x86_64=false
          architectures/arm64-v8a=true
          architectures/armeabi-v7a=true
          architectures/x86=false
          PRESET
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          p=Path.home()/'.config/godot/editor_settings-4.4.tres'
          raw=p.read_text()
          updates={
              'export/android/android_sdk_path':os.environ['ANDROID_HOME'],
              'export/android/java_sdk_path':os.environ['JAVA_HOME'],
              'export/android/debug_keystore':str(Path.home()/'.android/debug.keystore'),
              'export/android/debug_keystore_pass':'android',
          }
          for key,value in updates.items():
              pattern=r'(?m)^'+re.escape(key)+r'\s*=.*$'
              line=key+' = "'+value+'"'
              if re.search(pattern,raw):
                  raw=re.sub(pattern,lambda _:line,raw,count=1)
              else:
                  raw=raw.replace('[resource]','[resource]\n'+line,1)
          p.write_text(raw)
          print('Updated Godot editor settings:',p)
          PY
      - name: Diagnosticar SDK Android
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "Godot editor settings:"
          cat "$HOME/.config/godot/editor_settings-4.4.tres" || true
          echo "Export templates:"
          ls -la "$HOME/.local/share/godot/export_templates/4.4.1.stable" || true
          echo "JAVA_HOME=$JAVA_HOME"
          ls -la "$ANDROID_HOME/build-tools" || true
          ls -la "$ANDROID_HOME/platforms" || true
          ls -la "$HOME/.config/godot" || true
          "$HOME/godot-bin/godot" --headless --path . --editor --verbose --quit > /tmp/android-diagnostics.log 2>&1 || true
          echo "Godot editor settings after startup:"
          cat "$HOME/.config/godot/editor_settings-4.4.tres" || true
          grep -Ei "android|sdk|keystore|export|error|warning" /tmp/android-diagnostics.log | tail -100 || true
      - name: Gerar APK novo
        run: |
          set -euo pipefail
          "$HOME/godot-bin/godot" --headless --path . --editor --export-debug Android "$GITHUB_WORKSPACE/Pixel_PC_Tycoon_V048.apk"
          test -s Pixel_PC_Tycoon_V048.apk
          unzip -t Pixel_PC_Tycoon_V048.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Pixel-PC-Tycoon-V048-APK
          path: Pixel_PC_Tycoon_V048.apk
          if-no-files-found: error
